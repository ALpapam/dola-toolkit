<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>Dola Toolkit</title>
    <!--
      CSP notes:
      * style-src / font-src / img-src must allow `blob:` — epub.js materialises
        every EPUB resource (stylesheets, fonts, illustrations) as a blob URL.
        Without `blob:` the chapter renders unstyled and illustrations are blocked.
      * `dola-font:` is the custom scheme that streams bundled + user-imported
        reader fonts from the main process; it must be allowed for both fonts and
        fetch() (the reader warms the faces with document.fonts.load).
      * `file:` is required in the packaged build: the page is loaded from
        `file://…/app.asar/out/renderer/index.html`, whose *origin* is the opaque
        "null", so `'self'` alone does not match the sibling assets or the
        `frame-src` used by epub.js. In dev the page is served over http://localhost
        and `'self'` works — hence the explicit file: entries that keep both modes
        functional. Without them, opening an EPUB hangs forever at "正在解析 EPUB…".
      * script-src stays strict ('self' only): book HTML never executes script.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self' file:; img-src 'self' data: blob: file: https: dola-font: dola-mod:; media-src 'self' blob: file: data:; style-src 'self' 'unsafe-inline' blob: file: dola-mod:; script-src 'self' file: dola-mod:; font-src 'self' data: blob: file: res: dola-font: dola-mod:; connect-src 'self' file: blob: data: dola-font: http://127.0.0.1:* https: ws://localhost:*; frame-src 'self' blob: data: file:"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

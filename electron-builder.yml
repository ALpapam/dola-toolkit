appId: io.dola.toolkit
productName: Dola Toolkit
copyright: Copyright © 2026 ALpapam
directories:
  buildResources: build
  output: dist
files:
  - out/**/*
  - package.json
  - '!**/*.map'
asar: true
# The ~200 MB of proxy cores (xray / mihomo / sing-box + geoip/geosite) are
# deliberately NOT embedded: a portable exe unpacks its payload to a temp folder
# on every launch, which would slow startup. They are shipped next to the exe
# instead (scripts/copy-cores.mjs); the app also falls back to
# D:\桌面\server\tool, so an existing install keeps working.
# Bundled reader font (~10 MB woff2 subset) — loaded through the dola-font scheme.
extraResources:
  - from: resources/fonts
    to: fonts
    filter:
      - '**/*'
  # The window icon and the notification-area icon are loaded at runtime from
  # disk. `files` only ships out/**, so without this the tray image resolves to
  # nothing and the icon is created but invisible.
  - from: build/icon.png
    to: icon.png
  - from: build/icon.ico
    to: icon.ico
  # 绕过大陆 needs sing-box binary rule-sets: the legacy geoip.dat / geosite.dat
  # that Xray and Mihomo read cannot be parsed by sing-box 1.14.
  - from: resources/geo
    to: geo
    filter:
      - '**/*'
  # licence + notices travel with the app so they can be read after install
  - from: LICENSE
    to: LICENSE
  - from: EULA.md
    to: EULA.md
  - from: THIRD-PARTY-NOTICES.md
    to: THIRD-PARTY-NOTICES.md
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
portable:
  artifactName: DolaToolkit-${version}-portable.${ext}
  requestExecutionLevel: user
  unpackDirName: dola-toolkit
nsis:
  # assisted installer: the user picks the folder and whether to have shortcuts
  oneClick: false
  # Elevated from the very start (one UAC prompt before anything else).
  #
  # A per-user install looked friendlier, but it cannot clean up after a previous
  # attempt: a stuck uninstaller or an app process started elevated belongs to a
  # different integrity level, so taskkill is denied, NSIS keeps reporting
  # "Dola Toolkit 无法关闭", and the retry then fails with
  # "无法打开要写入的文件 …\Uninstall Dola Toolkit.exe". Asking for admin up front
  # lets the cleanup below actually work, and installing under Program Files
  # matches what users expect from "setup.exe".
  perMachine: true
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  # the shortcut itself is renamed per system language in build/installer.nsh
  shortcutName: Dola Toolkit
  uninstallDisplayName: ${productName} ${version}
  artifactName: DolaToolkit-${version}-setup.${ext}
  # Plain-text licence page with a UTF-8 BOM. The BOM is what stops NSIS decoding it
  # as ANSI (that was the mojibake); plain text also paints immediately, unlike the
  # embedded HTML page which stayed blank until the user scrolled.
  license: build/license.txt
  include: build/installer.nsh
  runAfterFinish: true
  menuCategory: false
  installerLanguages:
    - zh_CN
    - en_US
  # no forced `language:` — the installer follows the system language, which is
  # also what decides the shortcut name (多拉工具箱 vs Dola Toolkit)
  deleteAppDataOnUninstall: false
npmRebuild: false
# reuse the already-installed local Electron instead of downloading it from GitHub
electronDist: node_modules/electron/dist
electronLanguages:
  - zh-CN
  - en-US

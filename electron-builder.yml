appId: io.dola.toolkit
productName: Dola Toolkit
copyright: Copyright © 2026 ALpapam
directories:
  buildResources: build
  output: dist
files:
  - out/**/*
  - package.json
  - '!**/*.map'
asar: true
# The ~200 MB of proxy cores (xray / mihomo / sing-box + geoip/geosite) are
# deliberately NOT embedded: a portable exe unpacks its payload to a temp folder
# on every launch, which would slow startup. They are shipped next to the exe
# instead (scripts/copy-cores.mjs); the app also falls back to
# D:\桌面\server\tool, so an existing install keeps working.
# Bundled reader font (~10 MB woff2 subset) — loaded through the dola-font scheme.
extraResources:
  - from: resources/fonts
    to: fonts
    filter:
      - '**/*'
  # The window icon and the notification-area icon are loaded at runtime from
  # disk. `files` only ships out/**, so without this the tray image resolves to
  # nothing and the icon is created but invisible.
  - from: build/icon.png
    to: icon.png
  - from: build/icon.ico
    to: icon.ico
  # 绕过大陆 needs sing-box binary rule-sets: the legacy geoip.dat / geosite.dat
  # that Xray and Mihomo read cannot be parsed by sing-box 1.14.
  - from: resources/geo
    to: geo
    filter:
      - '**/*'
win:
  icon: build/icon.ico
  target:
    - target: portable
      arch: [x64]
portable:
  artifactName: DolaToolkit-${version}-portable.${ext}
  requestExecutionLevel: user
  unpackDirName: dola-toolkit
npmRebuild: false
# reuse the already-installed local Electron instead of downloading it from GitHub
electronDist: node_modules/electron/dist
electronLanguages:
  - zh-CN
  - en-US
